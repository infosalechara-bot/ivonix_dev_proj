apiVersion: apps/v1
kind: Deployment
metadata: {name: pulse-embedding}
spec:
  replicas: 2
  selector: {matchLabels: {app: pulse-embedding}}
  template:
    metadata: {labels: {app: pulse-embedding}}
    spec:
      containers:
        - {name: embedding, image: yourregistry/pulse-embedding:latest, ports: [{containerPort: 8000}], readinessProbe: {httpGet: {path: /health, port: 8000}}}
---
apiVersion: v1
kind: Service
metadata: {name: pulse-embedding}
spec: {selector: {app: pulse-embedding}, ports: [{port: 8000, targetPort: 8000}]}
---
