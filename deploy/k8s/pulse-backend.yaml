apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-backend
  labels: {app: pulse-backend}
spec:
  replicas: 3
  strategy: {type: RollingUpdate}
  selector: {matchLabels: {app: pulse-backend}}
  template:
    metadata: {labels: {app: pulse-backend}}
    spec:
      containers:
        - name: backend
          image: yourregistry/pulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081}]
          envFrom: [{secretRef: {name: pulse-secrets}}]
          env:
            - {name: PULSE_CORS_ORIGINS, valueFrom: {configMapKeyRef: {name: pulse-config, key: cors-origins}}}
            - {name: PULSE_EMBEDDING_URL, value: http://pulse-embedding:8000}
            - {name: PULSE_AI_URL, value: http://pulse-ai:8000}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8081}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8081}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata: {name: pulse-backend}
spec:
  selector: {app: pulse-backend}
  ports: [{port: 8081, targetPort: 8081}]
  type: ClusterIP
