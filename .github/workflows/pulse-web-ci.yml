name: PULSE Web CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/pulse-web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/pulse-web-ci.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 > /tmp/pulse-web-preview.log 2>&1 & echo $! > /tmp/pulse-web-preview.pid
      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pulse-web-preview.log
          exit 1
      - name: WCAG AA audit
        run: npm run a11y:audit
      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/pulse-web-preview.pid ]; then kill "$(cat /tmp/pulse-web-preview.pid)" || true; fi
