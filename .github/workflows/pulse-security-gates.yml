name: PULSE Security Gates

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - 'docker-compose.yml'
      - '.github/workflows/pulse-security-gates.yml'
  push:
    branches: [pulse-production-bulk-hardening]

jobs:
  secret-and-dangerous-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed private keys and obvious credentials
        run: |
          set -eu
          if grep -RInE --exclude-dir=.git --exclude='*.lock' '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|aws_secret_access_key|SUPABASE_SERVICE_ROLE_KEY=[^$[:space:]]+|PULSE_MASTER_KEY=[^$[:space:]]+)' .; then
            echo 'Potential secret material found in repository.'
            exit 1
          fi
      - name: Reject unsafe dynamic SQL execution in application code
        run: |
          set -eu
          if grep -RInE --include='*.java' --include='*.py' --include='*.ts' --include='*.js' '(Runtime\.getRuntime\(\)\.exec|os\.system\(|subprocess\.run\([^\]]*shell[[:space:]]*=[[:space:]]*True|eval\(|new Function\()' apps packages; then
            echo 'Potential command/code injection primitive requires explicit review.'
            exit 1
          fi

  java-security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ontology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and execute Java security regression suite
        env:
          PULSE_FOUNDER_RECEIPT_SECRET: 0123456789abcdef0123456789abcdef
        run: mvn -q test

  migration-static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration filenames and SQL safety markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path('supabase/migrations').glob('*.sql'))
          assert files, 'No Supabase migrations found'
          versions = []
          for path in files:
              match = re.match(r'^(\d{12}|\d{14})_', path.name)
              assert match, f'Invalid migration filename: {path.name}'
              versions.append((match.group(1), path.name))
          ordered = [v for v, _ in versions]
          assert ordered == sorted(set(ordered)), 'Migration versions must be unique and sortable'

          for _, name in versions:
              assert not name.startswith(('00000000000000_', '99999999999999_')), f'Invalid sentinel migration: {name}'
          print(f'Validated {len(files)} migration files with unique 12- or 14-digit versions.')
          PY
      - name: Reject destructive migration primitives without explicit review marker
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if grep -Eiq '(^|[^-])\bDROP[[:space:]]+(TABLE|SCHEMA|DATABASE)\b|\bTRUNCATE[[:space:]]+' "$file"; then
              grep -Eiq 'PULSE-REVIEWED-DESTRUCTIVE|REQUIRES-FOUNDER-APPROVAL' "$file" || {
                echo "Destructive SQL requires an explicit review marker: $file"
                exit 1
              }
            fi
          done < <(find supabase/migrations -type f -name '*.sql' -print0)

  python-security-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: apps/core-runtime
          - path: apps/digital-twin
          - path: apps/embedding
          - path: apps/ai-training
          - path: apps/reclaim-worker
          - path: apps/veritas
          - path: apps/nl-to-sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: python -m pip install -r requirements.txt pytest
      - name: Compile service
        working-directory: ${{ matrix.path }}
        run: python -m compileall -q .
      - name: Run security tests when present
        working-directory: ${{ matrix.path }}
        env:
          PYTHONPATH: .
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          PULSE_RECLAIM_WORKER_SECRET: test-worker-secret
          PULSE_VERITAS_SERVICE_SECRET: test-veritas-secret
          PULSE_NL_TO_SQL_SERVICE_SECRET: test-nl-secret
        run: |
          if find . -maxdepth 2 -type f -name '*security*.py' -print -quit | grep -q .; then
            python -m pytest -q -k 'security or auth or tenant or ownership or injection'
          else
            python -m pytest -q
          fi

  compose-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Ensure internal service secrets are declared
        run: |
          set -eu
          for key in PULSE_RECLAIM_WORKER_SECRET PULSE_VERITAS_SERVICE_SECRET PULSE_NL_TO_SQL_SERVICE_SECRET PULSE_FOUNDER_AGENT_SECRET PULSE_FOUNDER_RECEIPT_SECRET; do
            grep -q "${key}" .env.example
            grep -q "${key}" docker-compose.yml
          done
