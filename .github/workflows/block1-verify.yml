name: Block 1 - Contract Verification

on:
  pull_request:
    paths:
      - 'packages/pulse-contracts/**'
      - 'scripts/verify_block1.sh'
      - 'scripts/check_registry_coverage.py'
      - '.github/workflows/block1-verify.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pulse-contracts/**'
      - 'scripts/verify_block1.sh'
      - 'scripts/check_registry_coverage.py'
      - '.github/workflows/block1-verify.yml'

concurrency:
  group: block1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.PULSE_TEST_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PULSE_TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make verification script executable
        run: chmod +x scripts/verify_block1.sh
      - name: Run Block 1 verification
        run: ./scripts/verify_block1.sh
