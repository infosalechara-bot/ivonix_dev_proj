name: PULSE API CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/pulse-api-ci.yml'
  push:
    branches: [main, pulse-production-bulk-hardening]
    paths:
      - 'apps/api/**'
      - '.github/workflows/pulse-api-ci.yml'

permissions:
  contents: read

jobs:
  api:
    name: TypeScript build and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Security boundary tests
        run: npm test -- --runInBand
