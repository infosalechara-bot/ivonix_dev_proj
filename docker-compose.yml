services:
  emqx:
    image: emqx:5.8.6
    ports: ["1883:1883", "18083:18083"]
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-change-me-local}
      PULSE_MQTT_WEBHOOK_SECRET: ${PULSE_MQTT_WEBHOOK_SECRET}
    volumes:
      - ./infra/emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./infra/emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-data:/opt/emqx/data
    restart: unless-stopped
  backend:
    build: ./apps/ontology
    ports: ["8081:8081"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET}
      PULSE_MASTER_KEY: ${PULSE_MASTER_KEY}
      PULSE_CRYPTO_SERVICE_SECRET: ${PULSE_CRYPTO_SERVICE_SECRET}
      PULSE_AI_SERVICE_SECRET: ${PULSE_AI_SERVICE_SECRET}
      PULSE_CORE_SERVICE_SECRET: ${PULSE_CORE_SERVICE_SECRET}
      PULSE_TWIN_SERVICE_SECRET: ${PULSE_TWIN_SERVICE_SECRET}
      PULSE_EMBEDDING_SERVICE_SECRET: ${PULSE_EMBEDDING_SERVICE_SECRET}
      PULSE_AI_TRAINING_SERVICE_SECRET: ${PULSE_AI_TRAINING_SERVICE_SECRET}
      PULSE_CERT_SIGNING_PRIVATE_KEY: ${PULSE_CERT_SIGNING_PRIVATE_KEY}
      PULSE_CERT_SIGNING_PUBLIC_KEY: ${PULSE_CERT_SIGNING_PUBLIC_KEY}
      PULSE_CERT_RENDERER_URL: ${PULSE_CERT_RENDERER_URL:-http://cert-renderer:8095}
      PULSE_CERT_RENDERER_SECRET: ${PULSE_CERT_RENDERER_SECRET}
      PULSE_RECLAIM_WORKER_URL: ${PULSE_RECLAIM_WORKER_URL:-http://reclaim-worker:8092}
      PULSE_RECLAIM_WORKER_SECRET: ${PULSE_RECLAIM_WORKER_SECRET}
      PULSE_VERITAS_URL: ${PULSE_VERITAS_URL:-http://veritas:8096}
      PULSE_VERITAS_SERVICE_SECRET: ${PULSE_VERITAS_SERVICE_SECRET}
      PULSE_NL_TO_SQL_URL: ${PULSE_NL_TO_SQL_URL:-http://nl-to-sql:8097}
      PULSE_NL_TO_SQL_SERVICE_SECRET: ${PULSE_NL_TO_SQL_SERVICE_SECRET}
      PULSE_FOUNDER_RECEIPT_SECRET: ${PULSE_FOUNDER_RECEIPT_SECRET}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
      TURN_URLS: ${TURN_URLS}
      PULSE_CORS_ORIGINS: ${PULSE_CORS_ORIGINS:-http://localhost:5173}
      PULSE_EMBEDDING_URL: ${PULSE_EMBEDDING_URL:-http://embedding:8000}
      PULSE_AI_URL: ${PULSE_AI_URL:-http://ai:8000}
      PULSE_CRYPTO_URL: ${PULSE_CRYPTO_URL:-http://key-service:8092}
      PULSE_CORE_URL: ${PULSE_CORE_URL:-http://core-runtime:8091}
      PULSE_TWIN_URL: ${PULSE_TWIN_URL:-http://digital-twin:8091}
      PULSE_AI_TRAINING_URL: ${PULSE_AI_TRAINING_URL:-http://ai-training:8000}
      PULSE_MQTT_URL: ${PULSE_MQTT_URL:-tcp://emqx:1883}
      PULSE_MQTT_USERNAME: ${PULSE_MQTT_USERNAME:-pulse-core}
      PULSE_MQTT_PASSWORD: ${PULSE_MQTT_PASSWORD}
      PULSE_MQTT_WEBHOOK_SECRET: ${PULSE_MQTT_WEBHOOK_SECRET}
      PULSE_MQTT_CLIENT_ID: ${PULSE_MQTT_CLIENT_ID:-pulse-core-publisher}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    depends_on: [emqx, embedding, ai, key-service, core-runtime, digital-twin, ai-training, cert-renderer, reclaim-worker, founder-agent, veritas, nl-to-sql]
    restart: unless-stopped
  frontend:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on: [backend]
    restart: unless-stopped
  embedding:
    build: ./apps/embedding
    expose: ["8000"]
    environment: { PULSE_EMBEDDING_SERVICE_SECRET: ${PULSE_EMBEDDING_SERVICE_SECRET} }
    restart: unless-stopped
  ai:
    build: ./apps/ai
    expose: ["8000"]
    environment: { PULSE_AI_SERVICE_SECRET: ${PULSE_AI_SERVICE_SECRET} }
    restart: unless-stopped
  ai-training:
    build: ./apps/ai-training
    expose: ["8000"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_AI_TRAINING_SERVICE_SECRET: ${PULSE_AI_TRAINING_SERVICE_SECRET}
      MODEL_ROOT: /models
    volumes:
      - ${AI_MODEL_ROOT_HOST:-./models}:/models:rw
      - ${AI_DATA_ROOT_HOST:-./data}:/data:ro
    restart: unless-stopped
  key-service:
    build: ./apps/key-service
    expose: ["8092"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_MASTER_KEY: ${PULSE_MASTER_KEY}
      PULSE_CRYPTO_SERVICE_SECRET: ${PULSE_CRYPTO_SERVICE_SECRET}
    restart: unless-stopped
  core-runtime:
    build: ./apps/core-runtime
    expose: ["8091"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_CORE_SERVICE_SECRET: ${PULSE_CORE_SERVICE_SECRET}
      CORE_MODEL_ROOT: /models
    volumes: ["${CORE_MODEL_ROOT_HOST:-./models}:/models:ro"]
    restart: unless-stopped
  digital-twin:
    build: ./apps/digital-twin
    expose: ["8091"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_TWIN_SERVICE_SECRET: ${PULSE_TWIN_SERVICE_SECRET}
    restart: unless-stopped
  cert-renderer:
    build: ./apps/cert-renderer
    expose: ["8095"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_CERT_RENDERER_SECRET: ${PULSE_CERT_RENDERER_SECRET}
    restart: unless-stopped
  transcript-worker:
    build: ./apps/transcript-worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-auto}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      POLL_SECONDS: ${TRANSCRIPT_POLL_SECONDS:-10}
    restart: unless-stopped
  reclaim-worker:
    build: ./apps/reclaim-worker
    expose: ["8092"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_RECLAIM_WORKER_SECRET: ${PULSE_RECLAIM_WORKER_SECRET}
      PULSE_RECLAIM_ROOT: /reclaim-inputs
      PULSE_RECLAIM_OUTPUT: /reclaim-output
    volumes:
      - ${RECLAIM_INPUT_ROOT_HOST:-./reclaim-inputs}:/reclaim-inputs:ro
      - ${RECLAIM_OUTPUT_ROOT_HOST:-./reclaim-output}:/reclaim-output:rw
    restart: unless-stopped
  founder-agent:
    build: ./apps/founder-agent
    expose: ["8094"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_FOUNDER_ORGANIZATION_ID: ${PULSE_FOUNDER_ORGANIZATION_ID}
      PULSE_FOUNDER_USER_ID: ${PULSE_FOUNDER_USER_ID}
      PULSE_FOUNDER_AGENT_SECRET: ${PULSE_FOUNDER_AGENT_SECRET}
    restart: unless-stopped
  veritas:
    build: ./apps/veritas
    expose: ["8096"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_VERITAS_SERVICE_SECRET: ${PULSE_VERITAS_SERVICE_SECRET}
    restart: unless-stopped
  nl-to-sql:
    build: ./apps/nl-to-sql
    expose: ["8097"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PULSE_NL_TO_SQL_SERVICE_SECRET: ${PULSE_NL_TO_SQL_SERVICE_SECRET}
    restart: unless-stopped

volumes:
  emqx-data:
