spring:
  application:
    name: pulse-machine-connect-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
PULSE_JWT_SECRET: ${PULSE_JWT_SECRET}
PULSE_ACCESS_TOKEN_SECONDS: ${PULSE_ACCESS_TOKEN_SECONDS:900}
PULSE_REFRESH_TOKEN_SECONDS: ${PULSE_REFRESH_TOKEN_SECONDS:2592000}
PULSE_RATE_LIMIT_PER_MINUTE: ${PULSE_RATE_LIMIT_PER_MINUTE:100}
PULSE_RATE_LIMIT_MAX_CLIENTS: ${PULSE_RATE_LIMIT_MAX_CLIENTS:10000}
PULSE_EMBEDDING_URL: ${PULSE_EMBEDDING_URL:http://embedding-service:8000}
PULSE_AI_URL: ${PULSE_AI_URL:http://ai-service:8000}
PULSE_EDGE_SYNC_DELAY_MS: ${PULSE_EDGE_SYNC_DELAY_MS:60000}
VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:}
SUPABASE_URL: ${SUPABASE_URL}
SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
